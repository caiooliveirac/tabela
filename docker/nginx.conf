server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;

    # Serve frontend estático
    # no-cache: sem ele o navegador reusa o index.html antigo (cache heurístico
    # pelo Last-Modified) e segue carregando o bundle velho depois do deploy.
    location /tabela/ {
        alias /usr/share/nginx/html/tabela/;
        try_files $uri $uri/ /tabela/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Bundles têm hash no nome: cache longo; o que não existe é 404, não o index.html.
    location /tabela/assets/ {
        alias /usr/share/nginx/html/tabela/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API requests para o container api
    location /tabela/api/ {
        proxy_pass http://tabela-api:3000/tabela/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /tabela/ws {
        proxy_pass http://tabela-api:3000/tabela/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
