services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabela}
      POSTGRES_DB: ${POSTGRES_DB:-tabela}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tabela}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tabela}:${POSTGRES_PASSWORD:-tabela}@db:5432/${POSTGRES_DB:-tabela}
      PORT: "3000"
      NODE_ENV: production
      # PIN da chefia (obrigatório para apagar/editar alertas). Sem ele, exclusões ficam bloqueadas.
      CHEFIA_PIN: ${CHEFIA_PIN:-}
      # PIN anterior — mantenha preenchido durante a janela de rotação, depois esvazie.
      CHEFIA_PIN_PREV: ${CHEFIA_PIN_PREV:-}
      # Alerta de bloqueio de IP vai para o privado do admin (mesmo bot do notifier).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      # Grupo dos reguladores (o mesmo do tabela-notifier): recebe os avisos de
      # UPA restrita e responde /upas. Vazio = avisos no grupo desligados.
      TELEGRAM_REGULADORES_CHAT_ID: ${TELEGRAM_REGULADORES_CHAT_ID:-}
      # Mapa do Google na aba Destino. Chave de NAVEGADOR, restrita por
      # referrer (mnrs.com.br) no console — não reusar a GOOGLE_MAPS_API_KEY
      # de servidor do gerar-locais.py. Vazio = aba usa o Leaflet.
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      # Opcional: Map ID criado no console para estilizar o mapa.
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
    networks:
      internal:
        aliases:
          - tabela-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/tabela/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: always
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
